name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
          # Install the package itself, so `pytest` can import derivgen
          # without relying on the current directory being on the path.
          pip install -e .

      # Verilator is the only external tool, and only for the optional lint
      # below. The framework itself needs nothing but the standard library.
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator

      - name: Lint
        run: ruff check derivgen tools tests

      - name: Tests
        run: python -m pytest -q

      - name: Benchmark
        run: python -m derivgen bench --json out/bench.json

      - name: Build the parent and every golden child, then lint them
        run: |
          set -e
          mkdir -p out
          python -m derivgen build memory/platforms/derivsense.tcl -o out/derivsense.v
          for tcl in memory/derivatives/*/child.tcl; do
            name=$(basename "$(dirname "$tcl")")
            python -m derivgen build "$tcl" -o "out/$name.v"
          done
          for v in out/*.v; do
            # The module name is not the file name (child.tcl declares its own
            # platform name), so read it out of the file. Naming the top also
            # stops Verilator warning that the library IPs look like tops too.
            top=$(sed -n 's/^module \([A-Za-z_][A-Za-z0-9_]*\).*/\1/p' "$v" | head -1)
            echo "--- $v  (top: $top)"
            verilator --lint-only --top-module "$top" \
              -Wno-DECLFILENAME -Wno-UNUSEDSIGNAL \
              -Imemory/ip_library/rtl "$v" memory/ip_library/rtl/*.v
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated
          path: out/
